name: Spell Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Try TeXtidote with Docker
      id: textidote
      continue-on-error: true
      run: |
        docker run --rm -v $PWD:/work sylvainhalle/textidote \
          --check en,grammar,maths,consistency \
          --output html \
          *.tex > textidote-report.html 2>/dev/null || echo "TeXtidote failed"
          
    - name: Fallback to codespell
      if: steps.textidote.outcome == 'failure'
      run: |
        pip install codespell
        codespell --skip="*.pdf,*.bin,*.git*" --ignore-words-list="eigenvalue,pseudoinverse,preconditioner,LaTeX" --quiet-level=2
        
    - name: Upload TeXtidote report if available
      if: steps.textidote.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: textidote-report
        path: textidote-report.html
        retention-days: 30
