name: Spell Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Spell Check
        uses: crate-ci/typos@v1.20.10
        with:
          config: ./typos.toml  # 指定配置文件
