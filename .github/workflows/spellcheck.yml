name: Spell Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Spell Check
        uses: codespell-project/actions-codespell@v2
        with:
          ignore_words_list: "ans,hist"
          skip: "*.pdf,*.bib"
          path: "."
