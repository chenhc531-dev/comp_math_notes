name: LaTeX Build with Spell Check
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          
      - name: Install spell check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aspell aspell-en
          pip install codespell
          
      - name: Check spelling with codespell
        run: |
          # 移除 || true，让 codespell 在发现错误时失败
          codespell --skip="*.pdf,*.bin,*.pyc,*.png,*.jpg" --ignore-words-list="tex,filename"
          
      - name: LaTeX specific spell check
        run: |
          # 创建自定义字典来忽略 LaTeX 命令
          cat > .aspell.en.pws << 'EOF'
          personal_ws-1.1 en 0
          BibTeX
          LaTeX
          tex
          EOF
          
          # 初始化错误标志
          has_errors=false
          
          # 检查所有 .tex 文件
          for file in $(find . -name "*.tex"); do
            echo "Checking $file"
            errors=$(aspell --lang=en --mode=tex --personal=.aspell.en.pws list < "$file")
            if [ -n "$errors" ]; then
              echo "❌ Spelling errors in $file:"
              echo "$errors"
              has_errors=true
            else
              echo "✅ $file: No spelling errors found"
            fi
          done
          
          # 如果有错误，则失败
          if [ "$has_errors" = true ]; then
            echo "Spelling check failed! Please fix the errors above."
            exit 1
          else
            echo "All files passed spelling check!"
          fi
