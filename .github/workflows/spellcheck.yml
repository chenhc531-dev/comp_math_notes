name: TeXtidote Spell Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Run TeXtidote
      uses: sylvainhalle/textidote-action@v1
      with:
        # 检查所有 .tex 文件
        files: "**/*.tex"
        # 检查规则：拼写、语法等
        check: "en,grammar,maths,consistency"
        # 输出格式
        output: "html"
        # 排除的检查规则（可选）
        # exclude: "mathspacing,units"
        
    - name: Upload TeXtidote report
      uses: actions/upload-artifact@v4
      with:
        name: textidote-report
        path: textidote-report.html
        retention-days: 30
