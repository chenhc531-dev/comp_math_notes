name: Compile LaTeX Documents

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup LaTeX
        run: |
          # 安装 LaTeX 和必要的包
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra latexmk
          
      - name: Compile all main .tex files
        run: |
          # 创建构建目录
          mkdir -p build
          
          # 查找并编译所有 .tex 文件
          find . -name "*.tex" -type f | while read texfile; do
            echo "=== Compiling: $texfile ==="
            filename=$(basename "$texfile" .tex)
            dirpath=$(dirname "$texfile")
            
            # 进入文件所在目录编译
            cd "$dirpath"
            latexmk -pdf -interaction=nonstopmode -output-directory=../build "$filename.tex" || echo "Note: Compilation may have issues for $texfile"
            cd - > /dev/null
          done
          
      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pdfs
          path: build/
          retention-days: 30
          
      - name: List compiled PDFs
        run: ls -la build/ || echo "No PDFs were generated"
