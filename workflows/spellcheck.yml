name: Spell Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        
      - name: Spell Check
        uses: rojopolis/spellcheck-github-actions@0.41.0
        uses: igsekor/pyspelling-any@v0.0.2
  
        with:
          source_files: "**/*.tex"
          task_name: LaTeX  
          config_path: .github/spellcheck-config.yml  
