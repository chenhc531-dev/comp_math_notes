name: Spell Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        
      - name: Spell Check
        uses: igsekor/pyspelling-any@v0.0.2
  
        with:
          configFile:'.my-custom-config.yml'  
