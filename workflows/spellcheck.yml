name: Spell Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Spell Check
        uses: rojopolis/spellcheck-github-actions@0.36.0
        with:
          source_files: "**/*.tex"
          task_name: Markdown
